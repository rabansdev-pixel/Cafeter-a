<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 440" width="100%" height="100%">
  <defs>
    <linearGradient id="bagGradKen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#241818"/>
      <stop offset="50%" stop-color="#140d0d"/>
      <stop offset="100%" stop-color="#0a0505"/>
    </linearGradient>
    <linearGradient id="rubyFoil" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#ffb8b8"/>
      <stop offset="40%" stop-color="#e04848"/>
      <stop offset="100%" stop-color="#8a1717"/>
    </linearGradient>
    <filter id="bagGlowKen" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.75"/>
    </filter>
  </defs>

  <g filter="url(#bagGlowKen)">
    <path d="M 60 50 L 260 50 L 275 80 L 45 80 Z" fill="#1f1313" stroke="#3b2424" stroke-width="1.5"/>
    <circle cx="160" cy="110" r="10" fill="#140b0b" stroke="#4a2c2c" stroke-width="2"/>
    <circle cx="160" cy="110" r="4" fill="#0c0505"/>
    
    <path d="M 45 80 Q 40 240 50 400 L 270 400 Q 280 240 275 80 Z" fill="url(#bagGradKen)" stroke="#382121" stroke-width="1.5"/>
    <path d="M 45 80 L 70 400" stroke="rgba(255,255,255,0.05)" stroke-width="2" fill="none"/>
    <path d="M 275 80 L 250 400" stroke="rgba(0,0,0,0.5)" stroke-width="2" fill="none"/>

    <rect x="75" y="145" width="170" height="215" rx="8" fill="#140a0a" stroke="url(#rubyFoil)" stroke-width="1.8"/>
    
    <text x="160" y="175" font-family="'Playfair Display', serif" font-size="11" font-weight="bold" fill="url(#rubyFoil)" text-anchor="middle" letter-spacing="3">AFRICAN PEABERRY</text>
    <line x1="95" y1="185" x2="225" y2="185" stroke="url(#rubyFoil)" stroke-width="0.75" opacity="0.6"/>

    <text x="160" y="215" font-family="'Playfair Display', serif" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">KENIA NYERI</text>
    <text x="160" y="235" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="url(#rubyFoil)" text-anchor="middle" letter-spacing="1">KARINDUNDU • KENIA</text>

    <text x="160" y="265" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#c9b5b5" text-anchor="middle">1.900 MSNM • DOBLE LAVADO</text>
    <text x="160" y="280" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" fill="#f2d0d0" text-anchor="middle" font-style="italic">Grosella negra • Pomelo • Cacao</text>

    <rect x="110" y="305" width="100" height="22" rx="11" fill="rgba(224,72,72,0.15)" stroke="url(#rubyFoil)" stroke-width="1"/>
    <text x="160" y="320" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="bold" fill="url(#rubyFoil)" text-anchor="middle" letter-spacing="1.5">TUESTE MEDIO</text>

    <text x="160" y="348" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" fill="#755a5a" text-anchor="middle">340g / 12oz • CAFÉ EN GRANO</text>
