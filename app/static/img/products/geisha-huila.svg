<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 440" width="100%" height="100%">
  <defs>
    <!-- Gradiente de la bolsa color obsidiana mate -->
    <linearGradient id="bagGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#241e1a"/>
      <stop offset="50%" stop-color="#151210"/>
      <stop offset="100%" stop-color="#0a0807"/>
    </linearGradient>
    <!-- Gradiente dorado de lámina de oro (Gold Foil) -->
    <linearGradient id="goldFoil" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#ffe6a3"/>
      <stop offset="35%" stop-color="#d49a3d"/>
      <stop offset="70%" stop-color="#f8cf7c"/>
      <stop offset="100%" stop-color="#9a6519"/>
    </linearGradient>
    <!-- Sombra suave interior -->
    <filter id="bagGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.75"/>
    </filter>
  </defs>

  <!-- Cuerpo de la Bolsa de Café de Especialidad -->
  <g filter="url(#bagGlow)">
    <!-- Forma de fuelle superior sellado al calor -->
    <path d="M 60 50 L 260 50 L 275 80 L 45 80 Z" fill="#1d1815" stroke="#382f29" stroke-width="1.5"/>
    <!-- Válvula de desgasificación unidireccional -->
    <circle cx="160" cy="110" r="10" fill="#181412" stroke="#4a3e35" stroke-width="2"/>
    <circle cx="160" cy="110" r="4" fill="#0d0b09"/>
    <circle cx="157" cy="107" r="1" fill="#fff" opacity="0.3"/>
    
    <!-- Cuerpo principal de la bolsa -->
    <path d="M 45 80 Q 40 240 50 400 L 270 400 Q 280 240 275 80 Z" fill="url(#bagGrad)" stroke="#3a3028" stroke-width="1.5"/>
    <!-- Pliegues laterales de fuelle -->
    <path d="M 45 80 L 70 400" stroke="rgba(255,255,255,0.05)" stroke-width="2" fill="none"/>
    <path d="M 275 80 L 250 400" stroke="rgba(0,0,0,0.5)" stroke-width="2" fill="none"/>

    <!-- Etiqueta Editorial Minimalista (Gold & Black) -->
    <rect x="75" y="145" width="170" height="215" rx="8" fill="#120f0d" stroke="url(#goldFoil)" stroke-width="1.8"/>
    
    <!-- Insignia y Textos -->
    <text x="160" y="175" font-family="'Playfair Display', serif" font-size="11" font-weight="bold" fill="url(#goldFoil)" text-anchor="middle" letter-spacing="3">COLECCIÓN PRIVADA</text>
    <line x1="95" y1="185" x2="225" y2="185" stroke="url(#goldFoil)" stroke-width="0.75" opacity="0.6"/>

    <text x="160" y="215" font-family="'Playfair Display', serif" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle">GEISHA</text>
    <text x="160" y="235" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="url(#goldFoil)" text-anchor="middle" letter-spacing="1">HUILA • COLOMBIA</text>

    <!-- Datos de cata en etiqueta -->
    <text x="160" y="265" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#c4b5a2" text-anchor="middle">1.950 MSNM • ANAERÓBICO</text>
    <text x="160" y="280" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" fill="#e8d8c3" text-anchor="middle" font-style="italic">Jazmín • Bergamota • Miel</text>

    <!-- Sello de Tueste Claro -->
    <rect x="110" y="305" width="100" height="22" rx="11" fill="rgba(212,154,61,0.15)" stroke="url(#goldFoil)" stroke-width="1"/>
    <text x="160" y="320" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="bold" fill="url(#goldFoil)" text-anchor="middle" letter-spacing="1.5">TUESTE CLARO</text>

    <text x="160" y="348" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" fill="#7a6e60" text-anchor="middle">340g / 12oz • CAFÉ EN GRANO</text>
  </g>
</svg>
