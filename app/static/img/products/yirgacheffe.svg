<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 440" width="100%" height="100%">
  <defs>
    <linearGradient id="bagGradYir" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f1b24"/>
      <stop offset="50%" stop-color="#141117"/>
      <stop offset="100%" stop-color="#0a080c"/>
    </linearGradient>
    <linearGradient id="roseGoldFoil" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#ffd5df"/>
      <stop offset="40%" stop-color="#d98299"/>
      <stop offset="100%" stop-color="#914157"/>
    </linearGradient>
    <filter id="bagGlowYir" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.75"/>
    </filter>
  </defs>

  <g filter="url(#bagGlowYir)">
    <path d="M 60 50 L 260 50 L 275 80 L 45 80 Z" fill="#1b1720" stroke="#362d3d" stroke-width="1.5"/>
    <circle cx="160" cy="110" r="10" fill="#15121a" stroke="#483a52" stroke-width="2"/>
    <circle cx="160" cy="110" r="4" fill="#0c0a0e"/>
    
    <path d="M 45 80 Q 40 240 50 400 L 270 400 Q 280 240 275 80 Z" fill="url(#bagGradYir)" stroke="#382e40" stroke-width="1.5"/>
    <path d="M 45 80 L 70 400" stroke="rgba(255,255,255,0.05)" stroke-width="2" fill="none"/>
    <path d="M 275 80 L 250 400" stroke="rgba(0,0,0,0.5)" stroke-width="2" fill="none"/>

    <!-- Etiqueta -->
    <rect x="75" y="145" width="170" height="215" rx="8" fill="#131017" stroke="url(#roseGoldFoil)" stroke-width="1.8"/>
    
    <text x="160" y="175" font-family="'Playfair Display', serif" font-size="11" font-weight="bold" fill="url(#roseGoldFoil)" text-anchor="middle" letter-spacing="3">ORIGEN ANCESTRAL</text>
    <line x1="95" y1="185" x2="225" y2="185" stroke="url(#roseGoldFoil)" stroke-width="0.75" opacity="0.6"/>

    <text x="160" y="215" font-family="'Playfair Display', serif" font-size="19" font-weight="bold" fill="#ffffff" text-anchor="middle">YIRGACHEFFE</text>
    <text x="160" y="235" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="url(#roseGoldFoil)" text-anchor="middle" letter-spacing="1">ARICHA • ETIOPÍA</text>

    <text x="160" y="265" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#c7b9c9" text-anchor="middle">2.100 MSNM • LAVADO</text>
    <text x="160" y="280" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" fill="#edd6e1" text-anchor="middle" font-style="italic">Lavanda • Durazno • Earl Grey</text>

    <rect x="110" y="305" width="100" height="22" rx="11" fill="rgba(217,130,153,0.15)" stroke="url(#roseGoldFoil)" stroke-width="1"/>
    <text x="160" y="320" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="bold" fill="url(#roseGoldFoil)" text-anchor="middle" letter-spacing="1.5">TUESTE CLARO</text>

    <text x="160" y="348" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" fill="#75677a" text-anchor="middle">340g / 12oz • CAFÉ EN GRANO</text>
  </g>
</svg>
