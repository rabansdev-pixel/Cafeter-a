<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0e0c0a">
    <meta name="description" content="{% block meta_description %}ZERO DAY. Una cafetería. Un lugar para quedarse. El arte de tomarse un momento.{% endblock %}">
    <title>{% block title %}ZERO-DAY COFFEE | Granos de Especialidad & Origen Único{% endblock %}</title>

    <!-- Tipografía Editorial Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,400;1,600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Hojas de Estilos del Sistema de Diseño -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/variables.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/components.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/animations.css') }}">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/site.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/cafe.css') }}">
    {% block extra_head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
    <a class="skip-link" href="#main-content">Saltar al contenido</a>
    <!-- Navbar Flotante -->
    {% include 'components/navbar.html' %}

    <!-- Contenido Principal -->
    <main id="main-content" tabindex="-1">
        {% block content %}{% endblock %}
    </main>


    {% include 'components/footer.html' %}

    <!-- Scripts Modulares ES -->
    <script type="module" src="{{ url_for('static', filename='js/main.js') }}"></script>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
