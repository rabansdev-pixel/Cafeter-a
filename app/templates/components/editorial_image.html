{% macro photo(name, alt, folder='menu', sizes='(max-width: 767px) 100vw, 50vw', eager=false) -%}
<img src="{{ url_for('static', filename='img/' ~ folder ~ '/' ~ name ~ '-1600.jpg') }}" srcset="{{ url_for('static', filename='img/' ~ folder ~ '/' ~ name ~ '-800.jpg') }} 800w, {{ url_for('static', filename='img/' ~ folder ~ '/' ~ name ~ '-1600.jpg') }} 1600w" sizes="{{ sizes }}" alt="{{ alt }}" loading="{{ 'eager' if eager else 'lazy' }}" decoding="async" width="1600" height="1200">
{%- endmacro %}
