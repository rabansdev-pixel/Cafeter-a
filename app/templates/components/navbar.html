<header class="site-header">
    <nav class="site-nav" aria-label="Navegación principal">
        <a href="{{ url_for('main.home') }}" class="site-brand" aria-label="ZERO-DAY, inicio">ZERO DAY<span>EL ARTE DE TOMARSE UN MOMENTO</span></a>
        <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="site-menu">Menú <span aria-hidden="true">+</span></button>
        <ul class="site-menu" id="site-menu">
            {% for anchor, label in [('cafe', 'Café'), ('espacio', 'Espacio'), ('menu', 'Menú'), ('experiencia', 'Experiencia'), ('visitanos', 'Visítanos')] %}
            <li><a href="{{ url_for('main.home') }}#{{ anchor }}">{{ label }}</a></li>
            {% endfor %}
        </ul>
    </nav>
</header>
